[workspace]
resolver = "2"
members = ["crates/docket-bundle", "crates/virp-verify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
# Seal minisign verification only: BLAKE2b-512 for the prehashed ("ED")
# signature kind, base64 for the minisign wire encoding. Both RustCrypto /
# crates.io standards, MIT OR Apache-2.0 (inside the deny.toml allowlist).
blake2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
