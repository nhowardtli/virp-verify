# Pins the toolchain the overnight bootstrap session built and tested against
# (NIGHT-LOG.md: rustup user-local install, stable 1.98.0). rustup reads this
# file and selects the same toolchain on every machine, so CI and other
# checkouts build exactly what was verified here.
[toolchain]
channel = "1.98.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
