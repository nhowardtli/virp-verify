[workspace]
resolver = "2"
members = ["crates/docket-bundle", "crates/virp-verify"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
